name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      # TODO: tres steps distintos: lint, format:check y test:unit
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test unit
        run: npm run test:unit
  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas y cobertura
        run: npm run coverage
      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Construir y arrancar
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker compose up -d --build
      - name: Esperar a la versión
        run: node scripts/wait-for-version.js http://localhost:3000 "$GITHUB_SHA" 90
      - name: Smoke tests
        env:
          BASE_URL: http://localhost:3000
          EXPECTED_SHA: ${{ github.sha }}
        run: npm run test:e2e
      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs
      - name: Apagar y limpiar
        if: always()
        run: docker compose down -v
